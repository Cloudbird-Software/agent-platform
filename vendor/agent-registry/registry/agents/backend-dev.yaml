id: backend-dev
version: 2.0.0
status: approved
archetype: builder
trust_zone: trusted_control              # = profile（validate 强制一致）
role: "Go/TS 后端开发：模块实现 + unit 测试 + PR 提交；acceptance 树只读"
identity:
  prompt_ref: identities/backend-dev.md
model:
  alias: coder-fast
  temperature: 0.2
  reasoning_level: low
capabilities:
  skills: [skill:tdd-loop, skill:code-review-fix]
  tools: [tool:bash, tool:read_file, tool:write_file, tool:gitcode-pr]
  allow: [fs_read, fs_write_sandbox, fs_write_repo, vcs_read, vcs_branch_push, vcs_pr_open, shell_sandbox]   # 白名单=profile allow 交集（validate：工具副作用 ⊆ allow）
  agent_tools:
    refs: [agent:researcher-code]        # 检索增强（profile: 仅 researcher，≤2）
isolation: team                          # = profile
approval: auto                           # = profile
permissions:
  inherit: org-default
  overrides:
    - {tools: [tool:bash], pattern: "git push origin main*", severity: CRITICAL, action: deny}   # 推自己分支可以（vcs_branch_push），main 不行
    - {tools: [tool:write_file], pattern: "tests/acceptance/**", action: deny}                  # CT-BLD-001 声明层配合
    - {tools: [tool:bash], pattern: "re:.*rm -rf.*", action: deny}
credential:
  github_app: cloudbrid-agent
  secrets: [GITCODE_TOKEN]
memory:
  types: [episodic]
  retention: 30d
guardrails:
  output_schema_strict: true
  must_run: ["make check"]
  forbidden: [no-self-acceptance-test, no-force-push, no-secret-output, no-bypass-gate]
  post_conditions:
    - "[ci] PR gate 全绿"
    - "[ci] PR metadata 含卡号"
    - "[llm] 提交说明与任务目标对应"
io_contract:
  input: {schema_ref: schemas/task-in.json}
  output: {schema_ref: schemas/pr-out.json}
expose:
  as_tool: false                         # builder 不作为工具被调
  a2a_card: none
workspace:
  scope: team
