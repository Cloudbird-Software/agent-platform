[project]
name = "agentplatform"
version = "0.1.0"
description = "agent-registry 声明 → openjiuwen/jiuwenswarm 运行时的渲染与治理执行层（ADR-0025）"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0,<7",
    "jsonschema>=4.21,<5",
    "rich>=13.7,<14",
]

[project.scripts]
ap = "agentplatform.cli:main"
agentctl = "agentplatform.observe.ctl:main"

[project.optional-dependencies]
# 上游运行时（重依赖，Docker 镜像/本机完整部署时装）。
# 钉版策略（ADR-0025）：PyPI wheel 双钉——jiuwenswarm==0.2.3 的 wheel 已把
# openjiuwen 钉到 ==0.1.16（其源码分支的 git@develop 滚动依赖不进入 wheel），
# 此处显式同版双钉使供应链在 lockfile 一眼可审。
runtime = [
    "openjiuwen==0.1.16",
    "jiuwenswarm==0.2.3",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff==0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentplatform"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# SIM108：三元表达式强制伤可读性；RUF001/002：中文文档的全角标点误报（本项目注释/文档为中文）
ignore = ["SIM108", "RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "upstream: 需要 openjiuwen/jiuwenswarm 安装（docker/本地完整部署）",
    "adversarial: 对抗性测试（篡改声明/越权/预算绕过/事件回改）",
]

[tool.coverage.run]
source = ["src/agentplatform"]
