[project]
name = "agentplatform"
version = "0.1.0"
description = "agent-registry 声明 → openjiuwen/jiuwenswarm 运行时的渲染与治理执行层（ADR-0025）"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0,<7",
    "jsonschema>=4.21,<5",
    "rich>=13.7,<14",
]

[project.scripts]
ap = "agentplatform.cli:main"
agentctl = "agentplatform.observe.ctl:main"

[project.optional-dependencies]
# dev 依赖之外的一切上游运行时（openjiuwen/jiuwenswarm）不走本文件——
# 它们的传递树含未发修复版的高危项（chromadb 预_auth RCE 等），进了 uv.lock
# 会被 dependency-graph 摄取，把每个无关 PR 的 deps 门禁染红。运行时钉版
# 收敛到 runtime/requirements.in → requirements.lock（独立审计面，ADR-0025）。
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<7",
    "ruff==0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentplatform"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# SIM108：三元表达式强制伤可读性；RUF001/002：中文文档的全角标点误报（本项目注释/文档为中文）
ignore = ["SIM108", "RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "upstream: 需要 openjiuwen/jiuwenswarm 安装（docker/本地完整部署）",
    "adversarial: 对抗性测试（篡改声明/越权/预算绕过/事件回改）",
]

[tool.coverage.run]
source = ["src/agentplatform"]
